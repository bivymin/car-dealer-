<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Browse Cars — Nairobi Cars</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    window.INVENTORY = window.INVENTORY || [];
    (async () => {
      try {
        const res = await fetch('data/inventory.json');
        window.INVENTORY = await res.json();
        // Trigger render if app.js loaded early
        if (typeof render === 'function') render();
      } catch(e) {}
    })();
  </script>
</head>
<body class="bg-gray-50 text-gray-900 pb-16 md:pb-0">
  <header class="bg-white border-b">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="font-bold text-xl">Nairobi Cars</a>
      <nav class="hidden md:flex gap-5 text-sm">
        <a href="listings.html" class="text-indigo-600 font-semibold">Listings</a>
        <a href="financing.html" class="hover:text-indigo-600">Financing</a>
        <a href="dealer.html" class="hover:text-indigo-600">Dealers</a>
        <a href="blog.html" class="hover:text-indigo-600">Blog</a>
        <a href="contact.html" class="hover:text-indigo-600">Contact</a>
      </nav>
      <a href="tel:+254700000000" class="md:hidden px-3 py-1.5 bg-gray-100 rounded">Call</a>
    </div>
  </header>

  <div class="max-w-6xl mx-auto px-4 py-6 grid md:grid-cols-4 gap-6">
    <!-- Filters Sidebar -->
    <aside class="bg-white p-4 border rounded-lg h-fit">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-bold">Filters</h2>
        <button id="reset-filters" class="text-xs text-indigo-600 hover:underline">Reset</button>
      </div>
      <div class="space-y-3 text-sm">
        <select id="filter-make" class="w-full border rounded px-2 py-2">
          <option value="">Any Make</option>
          <option value="Toyota">Toyota</option>
          <option value="Honda">Honda</option>
          <option value="Nissan">Nissan</option>
        </select>
        <select id="filter-model" class="w-full border rounded px-2 py-2">
          <option value="">Any Model</option>
          <option value="Vitz">Vitz</option>
          <option value="Fit">Fit</option>
          <option value="X-Trail">X-Trail</option>
        </select>
        <div class="grid grid-cols-2 gap-2">
          <input id="filter-year-min" type="number" placeholder="Min Year" class="w-full border rounded px-2 py-2">
          <input id="filter-year-max" type="number" placeholder="Max Year" class="w-full border rounded px-2 py-2">
        </div>
        <select id="filter-price-max" class="w-full border rounded px-2 py-2">
          <option value="">Max Price</option>
          <option value="1000000">1,000,000</option>
          <option value="1500000">1,500,000</option>
          <option value="2000000">2,000,000</option>
        </select>
        <select id="filter-fuel" class="w-full border rounded px-2 py-2">
          <option value="">Fuel Type</option>
          <option value="Petrol">Petrol</option>
          <option value="Diesel">Diesel</option>
          <option value="Hybrid">Hybrid</option>
        </select>
        <select id="filter-transmission" class="w-full border rounded px-2 py-2">
          <option value="">Transmission</option>
          <option value="Automatic">Automatic</option>
          <option value="Manual">Manual</option>
        </select>
        <select id="filter-body" class="w-full border rounded px-2 py-2">
          <option value="">Body Type</option>
          <option value="Hatchback">Hatchback</option>
          <option value="Sedan">Sedan</option>
          <option value="SUV">SUV</option>
        </select>
        <select id="filter-location" class="w-full border rounded px-2 py-2">
          <option value="">Location</option>
          <option value="Nairobi">Nairobi</option>
          <option value="Mombasa">Mombasa</option>
        </select>
      </div>
    </aside>

    <!-- Listings Grid -->
    <main class="md:col-span-3">
      <div id="listings-wrap" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Populated by JS -->
      </div>
    </main>
  </div>

  <!-- Lead Modal -->
  <div id="lead-modal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-end md:items-center justify-center z-50">
    <div class="bg-white w-full md:w-1/2 rounded-t-lg md:rounded-lg p-4">
      <div class="flex items-center justify-between">
        <h3 class="font-bold">Book Test Drive</h3>
        <button id="lead-close" class="text-gray-500">✕</button>
      </div>
      <form id="lead-form" class="mt-3 grid grid-cols-2 gap-3">
        <input id="name" placeholder="Name" class="border rounded px-2 py-2" required />
        <input id="phone" placeholder="Phone" class="border rounded px-2 py-2" required />
        <input id="date" type="date" class="border rounded px-2 py-2" required />
        <input id="time" type="time" class="border rounded px-2 py-2" required />
        <button class="col-span-2 px-3 py-2 bg-indigo-600 text-white rounded">Confirm</button>
      </form>
    </div>
  </div>

  <div class="sticky-mobile-cta">
    <button onclick="window.scrollTo(0,0)" class="px-3 py-2 bg-gray-100 rounded text-sm w-1/2">Filters</button>
    <a href="tel:+254700000000" class="px-3 py-2 bg-indigo-600 text-white rounded text-sm w-1/2 text-center">Call Now</a>
  </div>

  <script src="js/app.js"></script>
</body>
</html>

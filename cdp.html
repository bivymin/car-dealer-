<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Car Details — Nairobi Cars</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-gray-50 text-gray-900 pb-16 md:pb-0">
  <header class="bg-white border-b">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="font-bold text-xl">Nairobi Cars</a>
      <nav class="hidden md:flex gap-5 text-sm">
        <a href="listings.html" class="hover:text-indigo-600">Listings</a>
        <a href="financing.html" class="hover:text-indigo-600">Financing</a>
        <a href="dealer.html" class="hover:text-indigo-600">Dealers</a>
      </nav>
      <a href="listings.html" class="md:hidden text-sm text-indigo-600">← Back</a>
    </div>
  </header>

  <main id="cdp-content" class="max-w-6xl mx-auto px-4 py-8">
    <div class="text-center py-10">Loading vehicle details...</div>
  </main>

  <script>
    (async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const carId = urlParams.get('id');
      const content = document.getElementById('cdp-content');

      try {
        const res = await fetch('data/inventory.json');
        const cars = await res.json();
        const car = cars.find(c => c.id === carId);

        if (!car) {
          content.innerHTML = `<div class="text-center py-10 text-xl">Car not found. <a href="listings.html" class="text-indigo-600">View listings</a></div>`;
          return;
        }

        content.innerHTML = `
          <div class="grid md:grid-cols-2 gap-8">
            <div>
              <img src="${car.img}" alt="${car.make} ${car.model}" class="w-full rounded-lg shadow-sm">
            </div>
            <div>
              <div class="flex items-center gap-2 mb-2">
                ${car.verified ? '<span class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded">✓ Verified</span>' : ''}
                <span class="text-gray-500 text-sm">ID: ${car.id}</span>
              </div>
              <h1 class="text-3xl font-bold">${car.make} ${car.model} (${car.year})</h1>
              <p class="text-2xl font-bold text-indigo-600 mt-2">KES ${car.price.toLocaleString()}</p>
              
              <div class="grid grid-cols-2 gap-4 my-6 text-sm">
                <div class="border-b pb-2"><span class="text-gray-500 block">Mileage</span>${car.mileage.toLocaleString()} km</div>
                <div class="border-b pb-2"><span class="text-gray-500 block">Transmission</span>${car.transmission}</div>
                <div class="border-b pb-2"><span class="text-gray-500 block">Fuel</span>${car.fuel}</div>
                <div class="border-b pb-2"><span class="text-gray-500 block">Body Type</span>${car.body}</div>
                <div class="border-b pb-2"><span class="text-gray-500 block">Location</span>${car.location}</div>
                <div class="border-b pb-2"><span class="text-gray-500 block">Warranty</span>${car.warranty}</div>
              </div>

              <div class="mb-6">
                <h3 class="font-bold mb-2">Description</h3>
                <p class="text-gray-700 text-sm leading-relaxed">${car.description}</p>
              </div>

              <div class="bg-gray-100 p-4 rounded-lg mb-6">
                <p class="text-sm text-gray-600 mb-1">Offered by</p>
                <p class="font-bold">${car.dealer}</p>
              </div>

              <div class="flex gap-3">
                <button onclick="alert('Contacting CRM for test drive...')" class="flex-1 bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700">Book Test Drive</button>
                <a href="tel:+254700000000" class="flex-1 bg-white border border-gray-300 text-center py-3 rounded-lg font-semibold hover:bg-gray-50">Call Dealer</a>
              </div>
            </div>
          </div>
        `;
      } catch(e) {
        content.innerHTML = `<div class="text-center text-red-500">Failed to load data.</div>`;
      }
    })();
  </script>
</body>
</html>

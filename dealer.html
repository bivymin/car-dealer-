<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nairobi Auto Hub — Nairobi Cars</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-gray-50 text-gray-900">
  <header class="bg-white border-b">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="font-bold text-xl">Nairobi Cars</a>
      <nav class="hidden md:flex gap-5 text-sm">
        <a href="listings.html" class="hover:text-indigo-600">Listings</a>
        <a href="dealer.html" class="text-indigo-600 font-semibold">Dealers</a>
      </nav>
      <a href="tel:+254700000000" class="md:hidden px-3 py-1.5 bg-gray-100 rounded">Call</a>
    </div>
  </header>

  <section class="max-w-6xl mx-auto px-4 py-8">
    <div class="bg-white border rounded-lg p-6 flex flex-col md:flex-row gap-6 justify-between items-start">
      <div>
        <div class="flex items-center gap-2 mb-2">
          <h1 class="text-2xl font-bold">Nairobi Auto Hub</h1>
          <span class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded">Verified Dealer</span>
        </div>
        <p class="text-gray-600 text-sm">📍 Mombasa Road, Nairobi • 4.8★ (42 Reviews)</p>
        <p class="mt-4 text-sm text-gray-700 max-w-xl">Specializing in clean, low-mileage imports from Japan and local trade-ins. All our cars undergo a 150-point inspection.</p>
      </div>
      <div class="flex gap-3 w-full md:w-auto">
        <a href="tel:+254700000000" class="px-4 py-2 bg-indigo-600 text-white rounded text-center flex-1 md:flex-none">Call Dealer</a>
        <a href="#" class="px-4 py-2 bg-green-500 text-white rounded text-center flex-1 md:flex-none">WhatsApp</a>
      </div>
    </div>

    <h2 class="text-xl font-bold mt-10 mb-4">Dealer Inventory</h2>
    <div id="dealer-listings" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Injected by simple inline script for demo purposes -->
    </div>
  </section>

  <script>
    (async () => {
      try {
        const res = await fetch('data/inventory.json');
        const cars = await res.json();
        const dealerCars = cars.filter(c => c.dealer === "Nairobi Auto Hub");
        const wrap = document.getElementById('dealer-listings');
        
        dealerCars.forEach(c => {
          wrap.innerHTML += `
            <article class="bg-white border rounded-lg overflow-hidden">
              <a href="cdp.html?id=${c.id}"><img src="${c.img}" alt="${c.make} ${c.model}" class="w-full h-48 object-cover"></a>
              <div class="p-4">
                <h3 class="font-bold">${c.make} ${c.model}</h3>
                <p class="text-sm text-gray-600">${c.year} • ${c.mileage}km</p>
                <p class="mt-2 font-bold text-lg">KES ${c.price.toLocaleString()}</p>
                <a href="cdp.html?id=${c.id}" class="mt-3 block text-center px-3 py-2 bg-indigo-50 text-indigo-600 rounded">View Details</a>
              </div>
            </article>
          `;
        });
      } catch(e) {}
    })();
  </script>
</body>
</html>

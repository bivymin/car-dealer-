<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact Us — Nairobi Cars</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <header class="bg-white border-b">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="font-bold text-xl">Nairobi Cars</a>
      <nav class="hidden md:flex gap-5 text-sm">
        <a href="listings.html" class="hover:text-indigo-600">Listings</a>
        <a href="financing.html" class="hover:text-indigo-600">Financing</a>
        <a href="contact.html" class="text-indigo-600 font-semibold">Contact</a>
      </nav>
    </div>
  </header>

  <div class="max-w-5xl mx-auto px-4 py-12 grid md:grid-cols-2 gap-10">
    <div>
      <h1 class="text-3xl font-bold mb-4">Get in Touch</h1>
      <p class="text-gray-600 mb-8">Looking for a specific car? Have questions about financing? Reach out to our team.</p>
      
      <div class="space-y-4 text-sm text-gray-800">
        <p><strong>Phone:</strong> +254 700 000 000</p>
        <p><strong>WhatsApp:</strong> +254 700 000 000</p>
        <p><strong>Email:</strong> sales@nairobicars.co.ke</p>
        <p><strong>Office:</strong> The Auto Hub, Mombasa Road, Nairobi</p>
      </div>

      <div class="mt-8">
        <button class="px-6 py-3 bg-green-500 text-white font-bold rounded-lg hover:bg-green-600 w-full md:w-auto">Chat on WhatsApp</button>
      </div>
    </div>

    <div class="bg-white border rounded-lg p-6 shadow-sm">
      <form onsubmit="event.preventDefault(); alert('Message sent!');">
        <div class="mb-4">
          <label class="block text-sm text-gray-700 mb-1">Name</label>
          <input type="text" class="w-full border rounded px-3 py-2" required>
        </div>
        <div class="mb-4">
          <label class="block text-sm text-gray-700 mb-1">Phone Number</label>
          <input type="tel" class="w-full border rounded px-3 py-2" required>
        </div>
        <div class="mb-4">
          <label class="block text-sm text-gray-700 mb-1">Message</label>
          <textarea rows="4" class="w-full border rounded px-3 py-2" required></textarea>
        </div>
        <button class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700">Send Message</button>
      </form>
    </div>
  </div>
</body>
</html>
